# CI baseline for dsh-browser-cdp — npm variant (remote main ships package-lock.json only).
# Generated 2026-11-05 (v2: switched from pnpm to npm after cloud run showed
# the working-tree pnpm-lock.yaml was never committed).

name: CI

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The runtime reads lib/ and bin/, not src/. A committed artifact that no
      # longer matches its source means "install the tarball and run old code",
      # and nothing else in this workflow would notice.
      - name: artifacts are in sync with src
        run: git diff --exit-code -- lib bin